<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* Click-through window slightly larger than the recorded region: the border sits outside it,
       the middle is transparent so the capture sees straight through. */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    .frame { position: fixed; inset: 0; border: 2px dashed #ff3b30; }
  </style>
</head>
<body><div class="frame"></div></body>
</html>
