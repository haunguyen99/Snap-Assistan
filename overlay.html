<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; font-family: Segoe UI, Arial, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; }

    #sizeLabel {
      position: fixed; display: none; padding: 2px 6px; font-size: 12px; font-weight: 600;
      color: #fff; background: rgba(0, 0, 0, .75); border-radius: 2px; pointer-events: none; white-space: nowrap;
    }

    .toolbar {
      position: fixed; display: none; background: #e9e9e9; border: 1px solid #b5b5b5;
      border-radius: 3px; box-shadow: 0 1px 4px rgba(0, 0, 0, .35); padding: 2px; z-index: 10;
    }
    #toolsV { flex-direction: column; }
    #toolsH { flex-direction: row; }
    .toolbar button {
      width: 26px; height: 26px; margin: 1px; padding: 0; border: 1px solid transparent; border-radius: 2px;
      background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #444;
    }
    .toolbar button:hover { background: #fff; border-color: #c8c8c8; }
    .toolbar button.active { background: #cfe3ff; border-color: #7aa7e0; }
    .toolbar button svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .toolbar .sep { background: #c4c4c4; }
    #toolsV .sep { height: 1px; margin: 2px 3px; }
    #toolsH .sep { width: 1px; margin: 3px 2px; }
    #colorSwatch { width: 16px; height: 16px; border: 1px solid #555; }

    #palette {
      position: fixed; display: none; z-index: 11; background: #f2f2f2; border: 1px solid #b5b5b5; border-radius: 3px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .35); padding: 5px; width: 128px;
    }
    #palette .colors { display: grid; grid-template-columns: repeat(5, 20px); gap: 4px; }
    #palette .c { width: 20px; height: 20px; border: 1px solid #777; cursor: pointer; }
    #palette .c.sel { outline: 2px solid #2b7cd3; outline-offset: 1px; }
    #palette label { display: block; font-size: 11px; color: #333; margin-top: 6px; }
    #palette input[type=range] { width: 100%; }

    #textInput {
      position: fixed; display: none; z-index: 12; min-width: 40px; padding: 0; margin: 0;
      border: 1px dashed #888; background: transparent; outline: none; resize: none; overflow: hidden;
      font-family: Arial, sans-serif; line-height: 1.2; white-space: pre;
    }

    #toast {
      position: fixed; display: none; z-index: 20; left: 50%; top: 40px; transform: translateX(-50%);
      background: rgba(0, 0, 0, .8); color: #fff; padding: 6px 14px; border-radius: 4px; font-size: 13px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="sizeLabel"></div>

  <div id="toolsV" class="toolbar">
    <button data-tool="pen" title="Bút vẽ (P)"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
    <button data-tool="line" title="Đường thẳng (L)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
    <button data-tool="arrow" title="Mũi tên (A)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><path d="M10 5h9v9"/></svg></button>
    <button data-tool="rect" title="Hình chữ nhật (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12"/></svg></button>
    <button data-tool="marker" title="Bút đánh dấu (M)"><svg viewBox="0 0 24 24"><path d="M9 15l-3 5h6l1-3"/><path d="M9 15l7-11 4 3-7 10z"/></svg></button>
    <button data-tool="text" title="Chữ (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/></svg></button>
    <button id="btnColor" title="Màu &amp; độ dày"><div id="colorSwatch"></div></button>
    <div class="sep"></div>
    <button id="btnUndo" title="Hoàn tác (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
  </div>

  <div id="toolsH" class="toolbar">
    <button id="btnOcr" title="OCR &amp; Dịch (Enter)"><svg viewBox="0 0 24 24"><path d="M4 7V4h3M17 4h3v3M20 17v3h-3M7 20H4v-3"/><path d="M8 9h8M8 12h8M8 15h5"/></svg></button>
    <button id="btnSearch" title="Tìm văn bản trong ảnh trên Google"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></button>
    <button id="btnPrint" title="In (Ctrl+P)"><svg viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="7" rx="1"/><path d="M7 14h10v6H7z"/></svg></button>
    <button id="btnCopy" title="Sao chép (Ctrl+C)"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V4H4v12h4"/></svg></button>
    <button id="btnSave" title="Lưu (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4"/><rect x="8" y="13" width="8" height="5"/></svg></button>
    <div class="sep"></div>
    <button id="btnClose" title="Đóng (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <div id="palette">
    <div class="colors" id="colors"></div>
    <label>Độ dày: <span id="widthVal"></span></label>
    <input type="range" id="widthRange" min="1" max="12" step="1">
  </div>

  <textarea id="textInput" rows="1" spellcheck="false"></textarea>
  <div id="toast"></div>

  <script src="overlay.js"></script>
</body>
</html>
