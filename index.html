<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    :root { --gap:10px; --radius:8px; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 0; padding: 14px;
      background:#fff; color:#222;
      width: 100%; height: 100%;
      font-size: 12px
    }
    h1 {
      font-size: 16px; margin: 0 0 10px 0; font-weight: 600;
    }
    .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .col { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 14px; min-width: 84px; color:#333; }
    input[type="text"], input[type="password"] {
      flex: 1; padding: 6px 8px; font-size: 12px;
      border: 1px solid #cfcfcf; border-radius: var(--radius);
      outline: none;
    }
    input[type="text"]:focus, input[type="password"]:focus { border-color:#0a84ff; }
    .check { display:flex; align-items:center; gap:8px; font-size:11px; }
    hr { border: 0; height: 1px; background: #eee; margin: 10px 0; }
    .footer {
      display:flex; justify-content: space-between; align-items:center; margin-top: 8px;
    }
    .btn {
      padding: 6px 12px; border: 1px solid #d0d0d0; background:#f6f6f6; border-radius: var(--radius);
      font-size: 13px; cursor: pointer;
    }
    .btn.primary { background:#0a84ff; color:#fff; border-color:#0a84ff; }
    .btn:active { transform: translateY(1px); }
    .status { font-size:9px; color:#666; margin-left: 6px; min-height: 16px; }
    .ok { color:#0a7e0a; }
    .err { color:#b60000; }
    .hint { font-size: 12px; color:#666; }
    .section-title { font-size: 13px; font-weight: 600; margin-top: 6px; }
    .section-title .hint { font-weight: 400; font-size: 11px; }
    input.hotkey { cursor: pointer; font-weight: 600; text-align: center; caret-color: transparent; }
    input.hotkey.recording { border-color: #0a84ff; background: #eef5ff; color: #0a84ff; }
    input.hotkey.empty { color: #999; font-weight: 400; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex: none; }
    .dot.on { background: #2bb24c; }
    .dot.off { background: #e0453a; }
    .btn.mini { padding: 3px 8px; font-size: 13px; }
    .update-row { flex-wrap: wrap; }
    .upd-version { font-weight: 600; }
    .upd-status { color: #555; flex: 1; min-width: 120px; }
    .upd-status.err { color: #b60000; }
    .upd-status.good { color: #0a7e0a; }
    .upd-bar { display: none; width: 90px; height: 6px; background: #e6e6e6; border-radius: 3px; overflow: hidden; }
    .upd-bar div { height: 100%; width: 0; background: #0a84ff; transition: width .2s; }
    .grid {
      display:grid;
      grid-template-columns: auto 1fr;
      gap: 6px 10px;
      align-items:center;
    }
  </style>
</head>
<body>

  <div class="grid">
    <label>API Key</label>
    <div class="row">
      <input id="apiKeyInput" type="text" placeholder="AIza..." />
    </div>

    <label></label>
    <div class="section-title">Phím tắt <span class="hint">— bấm vào ô rồi nhấn tổ hợp phím · Backspace để tắt · Esc để huỷ</span></div>

    <label>Chụp màn hình</label>
    <div class="row hk-row">
      <input id="hk-capture" class="hotkey" data-id="capture" type="text" readonly />
      <span class="dot" id="dot-capture"></span>
      <button class="btn mini" data-reset="capture" title="Về mặc định">↺</button>
    </div>
    <label>OCR & Dịch</label>
    <div class="row hk-row">
      <input id="hk-ocr" class="hotkey" data-id="ocr" type="text" readonly />
      <span class="dot" id="dot-ocr"></span>
      <button class="btn mini" data-reset="ocr" title="Về mặc định">↺</button>
    </div>
    <label>Quay video vùng chọn</label>
    <div class="row hk-row">
      <input id="hk-record" class="hotkey" data-id="record" type="text" readonly />
      <span class="dot" id="dot-record"></span>
      <button class="btn mini" data-reset="record" title="Về mặc định">↺</button>
    </div>
    <label>Chat AI</label>
    <div class="row hk-row">
      <input id="hk-chat" class="hotkey" data-id="chat" type="text" readonly />
      <span class="dot" id="dot-chat"></span>
      <button class="btn mini" data-reset="chat" title="Về mặc định">↺</button>
    </div>

    <label></label>
    <div class="col">
      <div class="check">
        <input id="autoLaunchToggle" type="checkbox" />
        <span>Tự khởi động cùng hệ thống</span>
        <input id="autoLaunchHiddenToggle" type="checkbox" />
        <span>Ẩn khi khởi động</span>
        <input id="singleCaptureToggle" type="checkbox" />
        <span>Dùng <b>1</b> file ảnh OCR (ghi đè)</span>       
      </div>
    </div>

    <label>Cập nhật</label>
    <div class="row update-row">
      <span id="updVersion" class="upd-version"></span>
      <span id="updStatus" class="upd-status"></span>
      <div class="upd-bar" id="updBar"><div id="updBarFill"></div></div>
      <button id="btnUpdate" class="btn mini">Kiểm tra cập nhật</button>
    </div>
    <label></label>
    <div class="check">
      <input id="autoUpdateToggle" type="checkbox" />
      <span>Tự động kiểm tra và tải bản mới</span>
    </div>
  </div>

  <hr />

  <div class="footer">
    <div>
      <button id="btnDefault" class="btn">Mặc định</button>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span id="status" class="status"></span>
      <button id="btnApply" class="btn primary">Áp dụng</button>
      <button id="btnClose" class="btn">Đóng</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
