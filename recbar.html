<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; font-family: Segoe UI, Arial, sans-serif; }
    .bar {
      height: 100%; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px;
      background: rgba(30, 30, 30, .92); color: #fff; border-radius: 8px; -webkit-app-region: drag;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff3b30; animation: blink 1s infinite; flex: none; }
    .paused .dot { background: #ffcc00; animation: none; }
    .waiting .dot { background: #888; animation: none; }
    @keyframes blink { 50% { opacity: .25; } }
    #time { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 48px; }
    #info { font-size: 11px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    button {
      -webkit-app-region: no-drag; width: 28px; height: 28px; border: none; border-radius: 5px; padding: 0;
      background: rgba(255, 255, 255, .1); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    button:hover { background: rgba(255, 255, 255, .22); }
    button:disabled { opacity: .4; cursor: default; }
    svg { width: 14px; height: 14px; fill: currentColor; }
    #btnStop { background: #e5372c; }
    #btnStop:hover { background: #ff4d42; }
  </style>
</head>
<body>
  <div class="bar waiting" id="bar">
    <div class="dot"></div>
    <div id="time">00:00</div>
    <div id="info">Đang chuẩn bị...</div>
    <button id="btnPause" title="Tạm dừng / Tiếp tục" disabled>
      <svg id="icoPause" viewBox="0 0 16 16"><rect x="3" y="2" width="4" height="12"/><rect x="9" y="2" width="4" height="12"/></svg>
      <svg id="icoPlay" viewBox="0 0 16 16" style="display:none"><path d="M4 2l10 6-10 6z"/></svg>
    </button>
    <button id="btnStop" title="Dừng và lưu" disabled><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1"/></svg></button>
    <button id="btnCancel" title="Huỷ (không lưu)"><svg viewBox="0 0 16 16"><path d="M3.5 2.1L8 6.6l4.5-4.5 1.4 1.4L9.4 8l4.5 4.5-1.4 1.4L8 9.4l-4.5 4.5-1.4-1.4L6.6 8 2.1 3.5z"/></svg></button>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const $ = (id) => document.getElementById(id);
    let elapsed = 0, lastTick = 0, paused = false, timer = null;

    const fmt = (ms) => {
      const s = Math.floor(ms / 1000), p = (n) => String(n).padStart(2, '0');
      return s >= 3600 ? `${Math.floor(s / 3600)}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}` : `${p(Math.floor(s / 60))}:${p(s % 60)}`;
    };
    const tick = () => {
      const now = performance.now();
      if (!paused) elapsed += now - lastTick;
      lastTick = now;
      $('time').textContent = fmt(elapsed);
    };

    ipcRenderer.on('rec-started', (_e, info) => {
      $('bar').classList.remove('waiting');
      $('info').textContent = `${info.width}×${info.height} · ${info.ext.toUpperCase()}${info.audio ? ' · 🔊' : ''}`;
      $('btnPause').disabled = $('btnStop').disabled = false;
      lastTick = performance.now();
      timer = setInterval(tick, 250);
    });

    $('btnPause').addEventListener('click', () => {
      paused = !paused;
      tick();
      $('bar').classList.toggle('paused', paused);
      $('icoPause').style.display = paused ? 'none' : '';
      $('icoPlay').style.display = paused ? '' : 'none';
      ipcRenderer.send('rec-control', paused ? 'pause' : 'resume');
    });
    $('btnStop').addEventListener('click', () => { clearInterval(timer); $('btnStop').disabled = true; ipcRenderer.send('rec-control', 'stop'); });
    $('btnCancel').addEventListener('click', () => { clearInterval(timer); ipcRenderer.send('rec-control', 'cancel'); });
  </script>
</body>
</html>
